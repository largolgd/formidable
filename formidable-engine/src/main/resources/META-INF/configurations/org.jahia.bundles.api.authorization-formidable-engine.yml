formidable-submit:
  description: Can submit Formidable forms
  metadata:
    visible: false
  auto_apply:
    - origin: hosted
  grants:
    - api: formidable-submit
      node: none
formidable-field-action:
  description: Can ask a Formidable form to check one field's value
  metadata:
    visible: false
  auto_apply:
    - origin: hosted
  grants:
    - api: formidable-field-action
      node: none
formidable-prefill:
  description: Can read the value a prefilled hidden field of a Formidable form shows
  metadata:
    visible: false
  auto_apply:
    - origin: hosted
  grants:
    - api: formidable-prefill
      node: none
