fmdbnnm_syncAction=Send to the NNM system
fmdbnnm_syncAction.ui.tooltip=Sends the form's configuration (id, version, fields) to the NNM system at each publication, then each submission after it is accepted. The visitor never waits for it and is never told when it fails.
fmdbnnm_syncAction.conditionField=Send only if the field (name)
fmdbnnm_syncAction.conditionField.ui.tooltip=Optional. The name of a field of the form. Leave empty to send every submission.
fmdbnnm_syncAction.conditionOperator=Condition
fmdbnnm_syncAction.conditionValue=Value
