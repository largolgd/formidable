# default configuration - deployed once, then kept as edited.
# The NNM system: where a form's configuration goes at each publication, and where each submission goes.
# These two URLs are placeholders until the real ones are known. No authentication yet.
configUrl=http://localhost:9090/api/form-configs
submissionUrl=http://localhost:9090/api/form-submissions
# Seconds to open the connection, and to get the whole answer. A submission is sent after the visitor
# has been answered, so a slow system costs a thread of the module, never the visitor's wait.
connectTimeoutSeconds=3
requestTimeoutSeconds=10
