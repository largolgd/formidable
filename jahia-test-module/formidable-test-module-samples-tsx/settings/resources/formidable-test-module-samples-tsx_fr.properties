fmdbsamplemix_helpTextPosition=Position de l'aide à la saisie
fmdbsamplemix_helpTextPosition.ui.tooltip=Place l'aide à la saisie d'un champ au-dessus de lui, en dessous, ou aux deux endroits. Prise en compte par le rendu du champ texte que ce module substitue à celui de Formidable.
fmdbsamplemix_helpTextPosition.helpTextPosition=Position de l'aide à la saisie
fmdbsamplemix_helpTextPosition.helpTextPosition.ui.tooltip=Où l'aide à la saisie s'affiche. Prise en compte aujourd'hui par le champ texte, dont ce module reprend le rendu.<br/><b>Au-dessus du champ :</b> sous le libellé, avant le champ (rendu par défaut).<br/><b>Sous le champ :</b> après le champ.<br/><b>Au-dessus et sous le champ :</b> aux deux endroits.
fmdbsamplemix_helpTextPosition.helpTextPosition.up=Au-dessus du champ
fmdbsamplemix_helpTextPosition.helpTextPosition.down=Sous le champ
fmdbsamplemix_helpTextPosition.helpTextPosition.both=Au-dessus et sous le champ


