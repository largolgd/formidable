fmdbsampletsx_inputQueryParam.ui.tooltip=Un champ caché rempli avec la valeur d'un paramètre GET de l'URL de la page.
fmdbsampletsx_inputQueryParam.queryParameter=Nom du paramètre
fmdbsampletsx_inputQueryParam.queryParameter.ui.tooltip=Nom du paramètre GET à lire (ex. <i>utm_source</i> pour <i>?utm_source=newsletter</i>).<br/><b>Sécurité :</b> <i>La valeur vient de l'URL et peut être définie par n'importe qui : ne lui faites jamais confiance</i>.
fmdbsampletsx_inputQueryParam.defaultValue=Valeur par défaut
fmdbsampletsx_inputQueryParam.defaultValue.ui.tooltip=Envoyée quand le paramètre est absent de l'URL ou vide.
