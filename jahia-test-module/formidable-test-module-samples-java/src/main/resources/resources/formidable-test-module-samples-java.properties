fmdbsample_logSubmissionAction=Log submission action
fmdbsample_logSubmissionAction.ui.tooltip=Writes each submission to the server log, for the test suite to read back.
sample.optionsSource.tv=TV screens
sample.staticList.plasma=Plasma screen
sample.staticList.oled=OLED screen
sample.staticList.led=LED screen
fmdbsample_emailDomainAction=Email domain check
fmdbsample_emailDomainAction.ui.tooltip=Refuses an address whose domain does not exist \u2014 a mistyped one, most often.<br/>It needs no account and no configuration. It does not prove the mailbox exists, nor even that the domain accepts mail: only the service of a provider can.
fmdbsample_blockedWordsAction=Blocked words check
fmdbsample_blockedWordsAction.ui.tooltip=Refuses a value that contains one of the listed words, whatever its case. A sample of a field action written in Java.
fmdbsample_blockedWordsAction.words=Blocked words
fmdbsample_blockedWordsAction.words.ui.tooltip=One word per entry; a value containing any of them, in any case, is refused.
fmdbsample_experianEmailAction=Email mailbox check (Experian)
fmdbsample_experianEmailAction.ui.tooltip=Asks Experian Email Validation whether the mailbox exists and receives mail: refuses an undeliverable, unreachable, illegitimate or disposable address; an answer the provider cannot conclude is a check that could not run.<br/>An example implementation: it needs an Experian account and a provider declared by the administrator. The address is sent to the provider.
fmdbsample_zeroBounceEmailAction=Email mailbox check (ZeroBounce)
fmdbsample_zeroBounceEmailAction.ui.tooltip=Asks ZeroBounce whether the mailbox exists and receives mail: refuses an invalid, spam-trap, abusive, disposable or toxic address, accepts a role address (info@, contact@); a catch-all domain or an answer the provider cannot conclude is a check that could not run.<br/>An example implementation: it needs a ZeroBounce account and a provider declared by the administrator. The address is sent to the provider.
fmdbsample_submissionIdAction=Submission identifier
fmdbsample_submissionIdAction.ui.tooltip=Generates a unique identifier such as 20261026-143012-4F2A (UTC date and time, then four random characters) when the form is submitted, and writes it into the hidden field named below.<br/>Place it before the actions that use the value (save, email, forward).
fmdbsample_submissionIdAction.fieldName=Hidden field name
fmdbsample_submissionIdAction.fieldName.ui.tooltip=The name of the hidden field (its node name) that receives the identifier.
fmdbsample_emailContentToContactAction=Send content by email to contacts
fmdbsample_emailContentToContactAction.ui.tooltip=Sends the submitted form content by email to the addresses of the contact options picked below, instead of an address typed in a field.<br/>Pick published options: the action reads the live content.
fmdbsample_emailContentToContactAction.contacts=Contact options (To)
fmdbsample_emailContentToContactAction.contacts.ui.tooltip=One or more contact options. Every address of every option picked receives the message, once. Optional if you type other recipients.
fmdbsample_emailContentToContactAction.from=Sender
fmdbsample_emailContentToContactAction.from.ui.tooltip=Optional sender address; the platform's default sender is used when empty or invalid.
fmdbsample_emailContentToContactAction.customRecipients=Other recipients (To)
fmdbsample_emailContentToContactAction.customRecipients.ui.tooltip=Extra addresses, added to those of the contact options. Separate them with a comma.<br/><b>Example:</b> <i>a@example.com, b@example.com</i>.
fmdbsample_emailContentToContactAction.ccContacts=Contact options (Cc)
fmdbsample_emailContentToContactAction.ccContacts.ui.tooltip=Contact options whose addresses are copied. An address already in the main recipients is not copied again.
fmdbsample_emailContentToContactAction.ccCustomRecipients=Other recipients (Cc)
fmdbsample_emailContentToContactAction.ccCustomRecipients.ui.tooltip=Extra addresses in copy. Separate them with a comma.<br/><b>Example:</b> <i>a@example.com, b@example.com</i>.
fmdbsample_emailContentToContactAction.bccContacts=Contact options (Bcc)
fmdbsample_emailContentToContactAction.bccContacts.ui.tooltip=Contact options whose addresses are in blind copy: the other recipients do not see them. An address already in To or Cc is not added again.
fmdbsample_emailContentToContactAction.bccCustomRecipients=Other recipients (Bcc)
fmdbsample_emailContentToContactAction.bccCustomRecipients.ui.tooltip=Extra addresses in blind copy. Separate them with a comma.<br/><b>Example:</b> <i>a@example.com, b@example.com</i>.
fmdbsample.section.routing=Contact routing
fmdbsample_emailContentToContactAction.routes=Routing rules
fmdbsample_emailContentToContactAction.routes.ui.tooltip=Adds recipients according to the answers: when a field of the form holds a value, the contact option of the rule is added to the main recipients (To). Pick published contact options only. A rule that lacks a field, a value or a contact is ignored.
