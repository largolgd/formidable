fmdbsample_logSubmissionAction=Action de journalisation des soumissions
fmdbsample_logSubmissionAction.ui.tooltip=\u00c9crit chaque soumission dans le journal du serveur, pour que la suite de tests la relise.
sample.optionsSource.tv=\u00c9crans TV
sample.staticList.plasma=\u00c9cran plasma
sample.staticList.oled=\u00c9cran OLED
sample.staticList.led=\u00c9cran LED
fmdbsample_emailDomainAction=V\u00e9rification du domaine de l'adresse
fmdbsample_emailDomainAction.ui.tooltip=Refuse une adresse dont le domaine n'existe pas \u2014 le plus souvent une faute de frappe.<br/>Ne demande ni compte ni configuration. Ne prouve pas que la bo\u00eete existe, ni m\u00eame que le domaine accepte le courrier : seul le service d'un prestataire le peut.
fmdbsample_blockedWordsAction=Contr\u00f4le des mots interdits
fmdbsample_blockedWordsAction.ui.tooltip=Refuse une valeur qui contient l'un des mots list\u00e9s, quelle que soit sa casse. Un exemple d'action de champ \u00e9crite en Java.
fmdbsample_blockedWordsAction.words=Mots interdits
fmdbsample_blockedWordsAction.words.ui.tooltip=Un mot par entr\u00e9e ; une valeur qui contient l'un d'eux, dans n'importe quelle casse, est refus\u00e9e.
fmdbsample_experianEmailAction=V\u00e9rification de la bo\u00eete mail (Experian)
fmdbsample_experianEmailAction.ui.tooltip=Demande \u00e0 Experian Email Validation si la bo\u00eete existe et re\u00e7oit du courrier : refuse une adresse injoignable, inexistante, ill\u00e9gitime ou jetable ; une r\u00e9ponse que le prestataire ne peut pas conclure est une v\u00e9rification qui n'a pas pu s'ex\u00e9cuter.<br/>Un exemple d'impl\u00e9mentation : il faut un compte Experian et un prestataire d\u00e9clar\u00e9 par l'administrateur. L'adresse est transmise au prestataire.
fmdbsample_zeroBounceEmailAction=V\u00e9rification de la bo\u00eete mail (ZeroBounce)
fmdbsample_zeroBounceEmailAction.ui.tooltip=Demande \u00e0 ZeroBounce si la bo\u00eete existe et re\u00e7oit du courrier : refuse une adresse invalide, pi\u00e8ge \u00e0 spam, abusive, jetable ou toxique, accepte une adresse de r\u00f4le (info@, contact@) ; un domaine fourre-tout ou une r\u00e9ponse que le prestataire ne peut pas conclure est une v\u00e9rification qui n'a pas pu s'ex\u00e9cuter.<br/>Un exemple d'impl\u00e9mentation : il faut un compte ZeroBounce et un prestataire d\u00e9clar\u00e9 par l'administrateur. L'adresse est transmise au prestataire.
fmdbsample_emailContentToContactAction=Envoyer le contenu par email aux contacts
fmdbsample_emailContentToContactAction.ui.tooltip=Envoie le contenu du formulaire par email aux adresses des options de contact choisies ci-dessous, au lieu d'une adresse saisie dans un champ.<br/>Choisissez des options publiées : l'action lit le contenu live.
fmdbsample_emailContentToContactAction.contacts=Options de contact
fmdbsample_emailContentToContactAction.contacts.ui.tooltip=Une ou plusieurs options de contact. Chaque adresse de chaque option choisie reçoit le message, une seule fois.
fmdbsample_emailContentToContactAction.from=Expéditeur
fmdbsample_emailContentToContactAction.from.ui.tooltip=Adresse d'expéditeur facultative ; l'expéditeur par défaut de la plateforme est utilisé si elle est vide ou invalide.
fmdbsample_emailContentToContactAction.customRecipients=Autres destinataires
fmdbsample_emailContentToContactAction.customRecipients.ui.tooltip=Adresses supplémentaires, ajoutées à celles des options de contact. Séparez-les par une virgule.<br/><b>Exemple :</b> <i>a@example.com, b@example.com</i>.
